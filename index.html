<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algorithm Analysis: Counting Steps</title>
<style>
:root{--bg:#F2F5FA;--ink:#111A2E;--ink2:#47536D;--rule:#C8D0DF;--accent:#2336C4;--raised:#FBFCFE;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0D1322;--ink:#E5E9F5;--ink2:#9CA8C6;--rule:#2B3655;--accent:#93A5FF;--raised:#111829;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
main{max-width:520px;width:100%}
h1{font-size:2.2rem;margin:0 0 6px}
p{color:var(--ink2);margin:0 0 22px}
a{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--rule);background:var(--raised);color:var(--ink);text-decoration:none;border-radius:8px;padding:14px 18px;margin:10px 0;font-weight:650}
a:hover{border-color:var(--accent)}
a small{color:var(--ink2);font-weight:500}
</style>
</head>
<body>
<main>
<h1>Algorithm Analysis: Counting Steps</h1>
<p>Mathematical analysis of algorithms &middot; Алгоритмдерді талдау &middot; Математический анализ алгоритмов</p>
<a id="ru" href="ru/">Русский <small>RU</small></a>
<a id="kk" href="kk/">Қазақша <small>ҚАЗ</small></a>
<a id="en" href="en/">English <small>EN</small></a>
</main>
<script>
(function () {
  var h = location.hash, l = (navigator.language || 'ru').toLowerCase(), to = l.indexOf('kk') === 0 ? 'kk' : l.indexOf('en') === 0 ? 'en' : 'ru';
  ['ru', 'kk', 'en'].forEach(function (x) { document.getElementById(x).href = x + '/' + h; });
  location.replace(to + '/' + h);
})();
</script>
</body>
</html>
